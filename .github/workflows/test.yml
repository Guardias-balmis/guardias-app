name: test

# npm test ya cubre la frescura de los artefactos generados (domain.gs/server-lib.gs vía
# v2/domain/test/parity.test.js, docs/catalogo-diseno.html vía test/catalogo.test.js): no hace
# falta un paso de build aparte, un fallo ahí ya es un fallo de "test". Cero dependencias
# externas (Node built-in test runner), así que no hace falta cache de npm ni instalar nada.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
