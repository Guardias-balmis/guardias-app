<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Guardias · Dr. Balmis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;min-height:100vh;color:#1a1a2e}
  input,select,textarea{font-family:inherit;font-size:15px}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#C0CCD8;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>

<!--
  Sin build (ADR-001 R11 / plan.md decisión C-1). Los .jsx se transpilan en el navegador
  (Babel Standalone) y se registran en window.UI.* / window.Screens.* — no pueden
  importarse entre sí, así que el ORDEN aquí no importa para la composición (boot.js
  espera activamente a que todos existan), pero sí conviene mantenerlo por legibilidad:
  componentes compartidos primero, pantallas después, la raíz (App) al final.
-->
<script type="text/babel" data-type="module" src="client/ui/components.jsx"></script>
<script type="text/babel" data-type="module" src="client/screens/Login.jsx"></script>
<script type="text/babel" data-type="module" src="client/screens/Home.jsx"></script>
<script type="text/babel" data-type="module" src="client/screens/Calendar.jsx"></script>
<script type="text/babel" data-type="module" src="client/screens/Prefs.jsx"></script>
<script type="text/babel" data-type="module" src="client/screens/Generator.jsx"></script>
<script type="text/babel" data-type="module" src="client/screens/Settings.jsx"></script>
<script type="text/babel" data-type="module" src="client/App.jsx"></script>
<script type="module" src="client/boot.js"></script>
</body>
</html>
