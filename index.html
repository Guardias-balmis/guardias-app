<!-- El handshake con cdnjs (DNS + TCP + TLS) se adelanta al parseo del <head> en vez de pagarse
     al llegar al primer <script>. De ahí salen React y ReactDOM, y —solo cuando hace falta—
     Babel Standalone (~2,3 MB, la descarga más pesada del arranque con diferencia). Mismo truco
     que ya se usaba con fonts.googleapis.com, aplicado al origen que de verdad manda en el
     tiempo de carga. -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<!-- Y lo mismo con el backend (2026-10-10): el /exec de Apps Script no contesta directo, responde 302
     a un enlace de script.googleusercontent.com, así que la primera petición de cada apertura paga
     DOS handshakes (DNS + TCP + TLS) en serie. Abrir los dos sockets mientras se descarga y compila
     el cliente se los quita de encima. `crossorigin` es obligatorio y no un adorno: el fetch de
     client/lib/api.js va con `credentials: "omit"`, y un preconnect sin `crossorigin` abre el socket
     del grupo CON credenciales, que ese fetch no reutiliza (medido: los sockets se abrían y no se
     usaban). Si Google cambiara el dominio del segundo salto, esto solo dejaría de ayudar. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<!-- Babel Standalone YA NO va aquí (2026-09-04): lo inyecta client/loader.js solo si algún .jsx
     no está en su caché de transpilado (primera visita o despliegue nuevo). Antes era un <script>
     bloqueante de 2,3 MB que había que descargar Y compilar antes de pintar un solo píxel, en
     cada visita. La versión exacta vive en loader.js (BABEL_URL), junto a la clave de la caché. -->
<!-- Todo lo que la app va a pedir, pedido A LA VEZ y desde el primer byte (2026-10-07, punto 7 de
     client/loader.js). Sin esto el navegador solo descubría los imports de cada .jsx al importarlo,
     y los .jsx se importan en orden: ocho idas y vueltas encadenadas antes de pintar Inicio, en cada
     vuelta a la app. Las dos listas son EXACTAMENTE el grafo de imports de `JSX_FILES` (loader.js);
     test/precarga.test.js lo comprueba y dice qué añadir o quitar. `crossorigin` en los .jsx hace
     que la precarga sea la misma petición que el `fetch` del cargador, en vez de bajarlos dos veces. -->
<link rel="preload" as="fetch" crossorigin href="client/ui/components.jsx">

<!-- Nunito Sans (a pedido del autor, 2026-08-18: "más vistosa y amigable" que la pila de fuentes
     del sistema). Si la CDN de Google Fonts no carga, `body` cae a la misma pila de antes —
     nunca se queda sin tipografía.
     Se carga SIN bloquear el pintado (2026-09-04): `media="print"` hace que el navegador la pida
     con prioridad baja y no espere a ella para pintar; al llegar, `onload` la aplica a todo. Con
     `display=swap` el texto sale con la pila del sistema y cambia a Nunito Sans al momento. El
     <noscript> conserva la carga normal si no hay JS (que tampoco tendría app, pero por si acaso). -->
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800&display=swap" rel="stylesheet"></noscript>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Nunito Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;min-height:100vh;color:#1a1a2e}
  input,select,textarea{font-family:inherit;font-size:15px}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#C0CCD8;border-radius:4px}

  /* Volumen + feedback táctil (2026-09-01, a pedido del autor: "más interactiva, estilo Google").
     Vive acá y no en client/lib/design-tokens.js porque :hover/:active/@keyframes no existen en
     un style={{}} de React — los componentes de client/ui/components.jsx (Btn, Card, QuickCard,
     Toast) SOLO ponen la clase; el color/tamaño de cada uno sigue en línea, sin tocar. Al vivir
     en los componentes compartidos, esto alcanza a TODAS las pantallas de una sola vez, no pantalla
     por pantalla. `prefers-reduced-motion` apaga la animación de entrada, nunca el feedback de
     toque en sí (que es instantáneo, no una animación que moleste).
     `@media (hover: hover)` excluye el resalte al pasar el mouse en pantallas táctiles, que no
     tienen "pasar el mouse" — ahí solo cuenta el `:active` al tocar. */
  .gapp-tap{transition:transform .15s cubic-bezier(.2,0,0,1),filter .15s cubic-bezier(.2,0,0,1),opacity .15s}
  .gapp-tap:active:not(:disabled){transform:scale(0.97)}
  @media (hover:hover){ .gapp-tap:hover:not(:disabled){filter:brightness(1.04)} }

  .gapp-card{transition:box-shadow .22s cubic-bezier(.2,0,0,1),transform .22s cubic-bezier(.2,0,0,1)}
  @media (hover:hover){
    .gapp-card:hover{box-shadow:0 2px 4px rgba(31,78,121,.10),0 10px 28px rgba(31,78,121,.16);transform:translateY(-1px)}
  }
  .gapp-card:active{transform:translateY(0) scale(.99)}

  /* Indicador deslizante de la pestaña activa en BottomNav (2026-09-01, App.jsx) — vive
     acá porque `left` se anima con `transition`, no con un keyframe, y por la misma razón
     de siempre no puede ir en un style={{}} de React. */
  .gapp-navind{transition:left .22s cubic-bezier(.2,0,0,1)}

  @keyframes gapp-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes gapp-pop{from{opacity:0;transform:translate(-50%,8px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
  .gapp-rise{animation:gapp-rise .28s cubic-bezier(.2,0,0,1) both}
  .gapp-pop{animation:gapp-pop .22s cubic-bezier(.2,0,0,1) both}

  /* «Entrando…» tras elegir la cuenta de Google (2026-10-07, Login.jsx): el login a Apps Script
     tarda unos segundos y la pantalla no cambiaba, así que parecía colgada. Un anillo que gira
     alrededor de la foto de la cuenta y una barra indeterminada al estilo Material. Con
     `prefers-reduced-motion` no se apagan —son la única señal de que la app sigue trabajando—,
     solo van más despacio. */
  @keyframes gapp-girar{to{transform:rotate(360deg)}}
  @keyframes gapp-barra{from{left:-40%}to{left:100%}}
  .gapp-anillo{animation:gapp-girar 1.1s linear infinite;transform-origin:50% 50%}
  .gapp-barra{position:absolute;top:0;bottom:0;width:40%;animation:gapp-barra 1.4s cubic-bezier(.4,0,.2,1) infinite}

  /* Pantalla de arranque (2026-10-07, punto 8 de client/loader.js): HTML estático dentro de #root,
     visible desde el primer pintado y sustituido por el primer render de React (`createRoot`; `ReactDOM.render` si no existe). La cabecera copia la de
     App.jsx para que el paso a la app no salte. No puede usar design-tokens.js (aún no hay JS):
     los colores son los mismos, escritos a mano. */
  .gapp-arranque-cab{background:#1F4E79;color:#fff;padding:14px 16px 10px;font-size:17px;font-weight:700;letter-spacing:.3px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .gapp-arranque-cuerpo{display:flex;flex-direction:column;align-items:center;gap:14px;padding:72px 24px 0;text-align:center;color:#1F4E79;font-size:15px;font-weight:700;line-height:1.5}
  @media (prefers-reduced-motion:reduce){
    .gapp-rise,.gapp-pop{animation:none}
    .gapp-tap,.gapp-card,.gapp-navind{transition:none}
    .gapp-anillo,.gapp-barra{animation-duration:3s}
  }
</style>
</head>
<body>
<div id="root">
  <!-- Pantalla de arranque: ver .gapp-arranque-* arriba. loader.js cambia el texto si tiene que
       transpilar (primera vez tras una versión nueva) y `fallo()` la sustituye por el error. -->
  <div role="status" aria-live="polite">
    <div class="gapp-arranque-cab">🏥 Guardias · Dr. Balmis</div>
    <div class="gapp-arranque-cuerpo">
      <svg class="gapp-anillo" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
        <circle cx="28" cy="28" r="24" fill="none" stroke="#E0E7EF" stroke-width="4"/>
        <circle cx="28" cy="28" r="24" fill="none" stroke="#2E75B6" stroke-width="4" stroke-linecap="round" stroke-dasharray="44 107"/>
      </svg>
      <div id="gapp-arranque-texto">Cargando…</div>
    </div>
  </div>
</div>

<!--
  Sin build (ADR-001 R11 / plan.md decisión C-1). Los .jsx se transpilan EN EL NAVEGADOR
  (Babel.transform) y se registran en window.UI.* / window.Screens.* — no pueden
  importarse entre sí (Babel no resuelve ese grafo), así que la composición cruzada usa
  esos namespaces globales. La carga la orquesta client/loader.js: fetch en paralelo +
  Babel.transform (o la caché en localStorage del transpilado, si el fuente no cambió) +
  import() en SECUENCIA (no el escaneo automático de Babel Standalone — verificado que
  con 8 ficheros pierde alguno en silencio). El orden de JSX_FILES en loader.js es el que
  importa; este único <script> es la única entrada.
-->
<!-- Con versión en la URL (2026-09-05): GitHub Pages sirve loader.js con max-age=600 y una recarga
     normal solo revalida el documento, así que un index.html nuevo podía ejecutar el loader.js
     VIEJO de la caché del navegador («No se pudo cargar el compilador (Babel)» hasta que caducara).
     Súbela en cada cambio del loader. -->
<script type="module" src="client/loader.js?v=20261010"></script>
</body>
