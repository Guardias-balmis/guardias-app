<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Guardias · Dr. Balmis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Nunito Sans (a pedido del autor, 2026-08-18: "más vistosa y amigable" que la pila de fuentes
     del sistema). Si la CDN de Google Fonts no carga, `body` cae a la misma pila de antes —
     nunca se queda sin tipografía. -->
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Nunito Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;min-height:100vh;color:#1a1a2e}
  input,select,textarea{font-family:inherit;font-size:15px}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#C0CCD8;border-radius:4px}

  /* Volumen + feedback táctil (2026-09-01, a pedido del autor: "más interactiva, estilo Google").
     Vive acá y no en client/lib/design-tokens.js porque :hover/:active/@keyframes no existen en
     un style={{}} de React — los componentes de client/ui/components.jsx (Btn, Card, QuickCard,
     Toast) SOLO ponen la clase; el color/tamaño de cada uno sigue en línea, sin tocar. Al vivir
     en los componentes compartidos, esto alcanza a TODAS las pantallas de una sola vez, no pantalla
     por pantalla. `prefers-reduced-motion` apaga la animación de entrada, nunca el feedback de
     toque en sí (que es instantáneo, no una animación que moleste).
     `@media (hover: hover)` excluye el resalte al pasar el mouse en pantallas táctiles, que no
     tienen "pasar el mouse" — ahí solo cuenta el `:active` al tocar. */
  .gapp-tap{transition:transform .15s cubic-bezier(.2,0,0,1),filter .15s cubic-bezier(.2,0,0,1),opacity .15s}
  .gapp-tap:active:not(:disabled){transform:scale(0.97)}
  @media (hover:hover){ .gapp-tap:hover:not(:disabled){filter:brightness(1.04)} }

  .gapp-card{transition:box-shadow .22s cubic-bezier(.2,0,0,1),transform .22s cubic-bezier(.2,0,0,1)}
  @media (hover:hover){
    .gapp-card:hover{box-shadow:0 2px 4px rgba(31,78,121,.10),0 10px 28px rgba(31,78,121,.16);transform:translateY(-1px)}
  }
  .gapp-card:active{transform:translateY(0) scale(.99)}

  @keyframes gapp-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes gapp-pop{from{opacity:0;transform:translate(-50%,8px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
  .gapp-rise{animation:gapp-rise .28s cubic-bezier(.2,0,0,1) both}
  .gapp-pop{animation:gapp-pop .22s cubic-bezier(.2,0,0,1) both}

  @media (prefers-reduced-motion:reduce){
    .gapp-rise,.gapp-pop{animation:none}
    .gapp-tap,.gapp-card{transition:none}
  }
</style>
</head>
<body>
<div id="root"></div>

<!--
  Sin build (ADR-001 R11 / plan.md decisión C-1). Los .jsx se transpilan EN EL NAVEGADOR
  (Babel.transform) y se registran en window.UI.* / window.Screens.* — no pueden
  importarse entre sí (Babel no resuelve ese grafo), así que la composición cruzada usa
  esos namespaces globales. La carga la orquesta client/loader.js: fetch + Babel.transform
  + import() en SECUENCIA (no el escaneo automático de Babel Standalone — verificado que
  con 8 ficheros pierde alguno en silencio). El orden de JSX_FILES en loader.js es el que
  importa; este único <script> es la única entrada.
-->
<script type="module" src="client/loader.js"></script>
</body>
</html>
